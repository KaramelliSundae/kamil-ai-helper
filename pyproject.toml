[project]
name = "ai-ders"
version = "0.1.0"
description = "Personal study agent: watches Canvas and school mail, reminds, answers, drafts."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.162",
  "httpx>=0.28",
  "imap-tools>=1.9",
  "pillow>=11",
  "uvicorn>=0.54",
]

[project.scripts]
ai-ders = "ai_ders.cli:main"

[dependency-groups]
dev = ["pytest>=9.2"]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.pytest.ini_options]
testpaths = ["tests"]
